name: Detect data drift
description: Detect drift in inference data
inputs:
- {name: model_name, type: String}
- {name: model_stage, type: String}
- {name: mlflow_host, type: String}
- {name: minio_host, type: String}
- {name: access_key, type: String}
- {name: secret_key, type: String}
- {name: reference_dataset_name, type: String}
- {name: share_of_drift_threshold, type: Float}
- {name: feature_dataset_path, type: OutputPath}
- {name: minio_drift_dashboard_path, type: String}
- {name: evidently_workspace_url, type: String}
- {name: evidently_ui_project_id, type: String}

implementation:
    container:
      image: 'varunmallya/detect-data-drift:v7'
      command: [python3, /app/src/detect_drift/detect_drift.py,
                --model_name, {inputValue: model_name},
                --model_stage, {inputValue: model_stage},
                --mlflow_host, {inputValue: mlflow_host},
                --minio_host, {inputValue: minio_host},
                --access_key, {inputValue: access_key},
                --secret_key, {inputValue: secret_key},
                --reference_dataset_name, {inputValue: reference_dataset_name},
                --share_of_drift_threshold, {inputValue: share_of_drift_threshold},
                --feature_dataset_path, {inputPath: feature_dataset_path},
                --minio_drift_dashboard_path, {inputValue: minio_drift_dashboard_path},
                --evidently_workspace_url, {inputValue: evidently_workspace_url},
                --evidently_ui_project_id, {inputValue: evidently_ui_project_id},
      ]
